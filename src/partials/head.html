<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
{{base}}
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{url}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Fr. C.O. Vargis Scholarship Fund">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{url}}">
<meta property="og:image" content="{{ogImage}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#edebe1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15140f" media="(prefers-color-scheme: dark)">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&display=swap">
<link rel="stylesheet" href="assets/css/styles.css">
<script>
  // Reveal animations hide content until main.js marks it visible.
  // If main.js never runs, drop the hook so nothing stays hidden.
  document.documentElement.classList.add("js");
  setTimeout(function () {
    if (!document.documentElement.classList.contains("reveal-on")) document.documentElement.classList.remove("js");
  }, 2500);
</script>
{{headExtra}}
</head>
