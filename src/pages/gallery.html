<dialog class="lightbox" data-lightbox aria-label="Photograph viewer" data-lenis-prevent>
  <figure>
    <figcaption class="pencil" data-lightbox-caption></figcaption>
  </figure>
  <div class="lightbox__bar">
    <button class="btn btn--paper btn--compact" type="button" data-prev>{{icon:prev}}<span class="sr-only">Previous photograph</span></button>
    <span class="lightbox__count" data-lightbox-count aria-live="polite"></span>
    <button class="btn btn--paper btn--compact" type="button" data-next>{{icon:next}}<span class="sr-only">Next photograph</span></button>
    <button class="btn btn--paper btn--compact" type="button" data-close>{{icon:close}} Close</button>
  </div>
</dialog>
